<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE ROUND</title>
<style>
  :root{
    --bg: #0a0a0d;
    --floor: #101014;
    --grid: #17171d;
    --player: #eef1f4;
    --enemy: #c1443b;
    --enemy-dim: #7a2b26;
    --bullet: #e8a33d;
    --ink: #eef1f4;
    --ink-dim: #6b6b74;
    --accent: #e8a33d;
    --danger: #c1443b;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Iowan Old Style','Palatino Linotype',Georgia,serif;
    color: var(--ink);
  }
  #wrap{
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas{
    display:block;
    background: var(--floor);
    cursor: crosshair;
    box-shadow: 0 0 0 1px #202027, 0 40px 100px -20px rgba(0,0,0,0.8);
  }
  #hud{
    position: absolute;
    top: 22px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 28px;
    pointer-events: none;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }
  #hud .num{
    color: var(--ink);
    font-size: 26px;
    font-family: Georgia, serif;
    font-variant-numeric: tabular-nums;
  }
  #hud .block{ text-align: left; }
  #hud .block.right{ text-align: right; }
  #reload-warning{
    position:absolute;
    bottom: 26px; left: 50%; transform: translateX(-50%);
    font-size: 13px;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    letter-spacing: 0.03em;
  }
  #reload-warning.show{ opacity: 1; }

  #overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction: column;
    background: rgba(8,8,10,0.88);
    backdrop-filter: blur(2px);
    text-align:center;
    transition: opacity 0.4s ease;
  }
  #overlay.hidden{ opacity:0; pointer-events:none; }
  #overlay h1{
    font-size: 56px;
    margin: 0 0 6px 0;
    font-weight: 400;
    letter-spacing: 0.01em;
  }
  #overlay .sub{
    color: var(--ink-dim);
    font-size: 16px;
    margin-bottom: 34px;
    max-width: 380px;
    line-height: 1.6;
  }
  #overlay .rule{
    color: var(--accent);
  }
  #overlay .stat{
    font-size: 15px;
    color: var(--ink-dim);
    margin-bottom: 30px;
  }
  #overlay .stat b{
    color: var(--ink);
    font-weight: 400;
    font-size: 20px;
  }
  button{
    font-family: inherit;
    background: transparent;
    border: 1px solid #3a3a42;
    color: var(--ink);
    padding: 13px 34px;
    font-size: 15px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button:hover{
    border-color: var(--accent);
    color: var(--accent);
  }
  #controls-note{
    position:absolute; bottom: 18px; left: 50%; transform:translateX(-50%);
    font-size: 12px; color: var(--ink-dim); letter-spacing:0.02em;
    display:flex; gap: 22px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>
  <div id="hud">
    <div class="block">
      <div class="num" id="wave-num">1</div>
      <div>wave</div>
    </div>
    <div class="block right">
      <div class="num" id="score-num">0</div>
      <div>kills</div>
    </div>
  </div>
  <div id="reload-warning">bullet's out there — go get it</div>
  <div id="controls-note">move — wasd / arrows &nbsp;·&nbsp; aim — mouse &nbsp;·&nbsp; fire — click</div>

  <div id="overlay">
    <h1 id="overlay-title">One Round</h1>
    <div class="sub" id="overlay-sub">
      One life. One bullet. Fire it and it's gone until you walk over it again.
      Everyone in this arena — <span class="rule">including you</span> — dies in a single hit.
    </div>
    <div class="stat" id="overlay-stat" style="display:none;"></div>
    <button id="start-btn">begin</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlaySub = document.getElementById('overlay-sub');
  const overlayStat = document.getElementById('overlay-stat');
  const startBtn = document.getElementById('start-btn');
  const waveNumEl = document.getElementById('wave-num');
  const scoreNumEl = document.getElementById('score-num');
  const reloadWarning = document.getElementById('reload-warning');

  const COLORS = {
    player: '#eef1f4',
    enemy: '#c1443b',
    enemyDim: '#7a2b26',
    bullet: '#e8a33d',
    grid: '#17171d'
  };

  let keys = {};
  let mouse = { x: W/2, y: H/2 };
  let running = false;
  let animId = null;

  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * (W / r.width);
    mouse.y = (e.clientY - r.top) * (H / r.height);
  });
  canvas.addEventListener('click', () => { if(running) tryShoot(); });

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

  // --- entities ---
  let player, bullet, enemies, particles, shake;
  let wave, score, gameOver;
  let spawnQueue, spawnTimer;

  function resetGame(){
    player = {
      x: W/2, y: H/2, r: 11,
      speed: 3.1,
      alive: true,
      hasBullet: true,
      angle: 0
    };
    bullet = null; // { x,y, state: 'flying'|'ground', vx, vy }
    enemies = [];
    particles = [];
    shake = 0;
    wave = 1;
    score = 0;
    gameOver = false;
    spawnTimer = 0;
    startWave(wave);
  }

  function startWave(n){
    const count = 2 + Math.floor(n * 1.5);
    spawnQueue = count;
    spawnTimer = 30;
  }

  function spawnEnemy(){
    const edge = Math.floor(Math.random()*4);
    let x,y;
    const pad = 30;
    if(edge===0){ x = Math.random()*W; y = -pad; }
    else if(edge===1){ x = W+pad; y = Math.random()*H; }
    else if(edge===2){ x = Math.random()*W; y = H+pad; }
    else { x = -pad; y = Math.random()*H; }
    const speedBase = 0.9 + Math.min(wave*0.08, 1.3);
    enemies.push({
      x, y, r: 12,
      speed: speedBase + Math.random()*0.3,
      alive: true,
      hitFlash: 0
    });
  }

  function tryShoot(){
    if(!player.alive || gameOver) return;
    if(!player.hasBullet) return;
    const dx = mouse.x - player.x, dy = mouse.y - player.y;
    const d = Math.hypot(dx,dy) || 1;
    const speed = 11;
    bullet = {
      x: player.x, y: player.y,
      vx: dx/d*speed, vy: dy/d*speed,
      state: 'flying'
    };
    player.hasBullet = false;
    shake = Math.max(shake, 3);
  }

  function killEnemy(en, cause){
    en.alive = false;
    score++;
    scoreNumEl.textContent = score;
    burst(en.x, en.y, COLORS.enemy, 16);
    shake = Math.max(shake, 6);
  }

  function killPlayer(){
    player.alive = false;
    gameOver = true;
    burst(player.x, player.y, COLORS.player, 26);
    shake = 14;
    setTimeout(showGameOver, 550);
  }

  function burst(x,y,color,n){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 1.5 + Math.random()*4;
      particles.push({
        x, y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 24 + Math.random()*18,
        maxLife: 42,
        color
      });
    }
  }

  function update(){
    if(gameOver){ return; }

    // player movement
    let dx=0, dy=0;
    if(keys['w']||keys['arrowup']) dy -= 1;
    if(keys['s']||keys['arrowdown']) dy += 1;
    if(keys['a']||keys['arrowleft']) dx -= 1;
    if(keys['d']||keys['arrowright']) dx += 1;
    if(dx||dy){
      const len = Math.hypot(dx,dy);
      player.x += (dx/len)*player.speed;
      player.y += (dy/len)*player.speed;
    }
    player.x = clamp(player.x, player.r, W-player.r);
    player.y = clamp(player.y, player.r, H-player.r);
    player.angle = Math.atan2(mouse.y-player.y, mouse.x-player.x);

    // bullet
    if(bullet){
      if(bullet.state === 'flying'){
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;
        // wall collision
        if(bullet.x < 4 || bullet.x > W-4 || bullet.y < 4 || bullet.y > H-4){
          bullet.x = clamp(bullet.x, 6, W-6);
          bullet.y = clamp(bullet.y, 6, H-6);
          bullet.state = 'ground';
          burst(bullet.x, bullet.y, COLORS.bullet, 6);
        }
        // enemy collision
        for(const en of enemies){
          if(!en.alive) continue;
          if(dist(bullet, en) < en.r + 4){
            killEnemy(en);
            bullet.state = 'ground';
            bullet.x = en.x; bullet.y = en.y;
            break;
          }
        }
      }
      // pickup
      if(bullet.state === 'ground' && !player.hasBullet){
        if(dist(bullet, player) < player.r + 10){
          player.hasBullet = true;
          bullet = null;
          burst(player.x, player.y, COLORS.bullet, 10);
        }
      }
    }

    reloadWarning.classList.toggle('show', !player.hasBullet && bullet && bullet.state === 'ground');

    // enemies
    for(const en of enemies){
      if(!en.alive) continue;
      const ddx = player.x - en.x, ddy = player.y - en.y;
      const d = Math.hypot(ddx,ddy) || 1;
      en.x += (ddx/d)*en.speed;
      en.y += (ddy/d)*en.speed;
      if(en.hitFlash>0) en.hitFlash--;

      if(player.alive && d < en.r + player.r - 2){
        killPlayer();
      }
    }
    enemies = enemies.filter(e => e.alive || false);

    // spawning
    if(spawnQueue > 0){
      spawnTimer--;
      if(spawnTimer <= 0){
        spawnEnemy();
        spawnQueue--;
        spawnTimer = Math.max(16, 45 - wave*2);
      }
    } else if(enemies.length === 0){
      wave++;
      waveNumEl.textContent = wave;
      startWave(wave);
    }

    // particles
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life--;
    }
    particles = particles.filter(p => p.life > 0);

    if(shake>0) shake *= 0.85;
    if(shake < 0.05) shake = 0;
  }

  function drawGrid(){
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    const step = 50;
    for(let x=0; x<=W; x+=step){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for(let y=0; y<=H; y+=step){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
  }

  function drawPlayer(){
    if(!player.alive) return;
    ctx.save();
    ctx.translate(player.x, player.y);

    // aim line
    ctx.save();
    ctx.rotate(player.angle);
    ctx.strokeStyle = player.hasBullet ? 'rgba(238,241,244,0.25)' : 'rgba(238,241,244,0.08)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(player.r+4, 0);
    ctx.lineTo(player.r+22, 0);
    ctx.stroke();
    ctx.restore();

    // body
    ctx.fillStyle = COLORS.player;
    ctx.beginPath();
    ctx.arc(0,0,player.r,0,Math.PI*2);
    ctx.fill();

    // hasBullet indicator ring
    if(player.hasBullet){
      ctx.strokeStyle = COLORS.bullet;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0,0,player.r+5,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawEnemies(){
    for(const en of enemies){
      if(!en.alive) continue;
      ctx.save();
      ctx.translate(en.x, en.y);
      ctx.fillStyle = en.hitFlash>0 ? '#fff' : COLORS.enemy;
      ctx.beginPath();
      // diamond shape to distinguish from player
      ctx.moveTo(0,-en.r);
      ctx.lineTo(en.r,0);
      ctx.lineTo(0,en.r);
      ctx.lineTo(-en.r,0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBullet(){
    if(!bullet) return;
    ctx.save();
    if(bullet.state === 'ground'){
      const pulse = 3 + Math.sin(Date.now()/180)*1.5;
      ctx.fillStyle = COLORS.bullet;
      ctx.shadowColor = COLORS.bullet;
      ctx.shadowBlur = 14 + pulse*2;
      ctx.beginPath();
      ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = COLORS.bullet;
      ctx.shadowColor = COLORS.bullet;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(bullet.x, bullet.y, 3.5, 0, Math.PI*2);
      ctx.fill();
      // trail
      ctx.strokeStyle = 'rgba(232,163,61,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bullet.x, bullet.y);
      ctx.lineTo(bullet.x - bullet.vx*2.2, bullet.y - bullet.vy*2.2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const t = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = clamp(t, 0, 1);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.2, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function render(){
    ctx.save();
    if(shake > 0.2){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    ctx.fillStyle = '#101014';
    ctx.fillRect(-20,-20,W+40,H+40);
    drawGrid();
    drawBullet();
    drawEnemies();
    drawPlayer();
    drawParticles();
    ctx.restore();
  }

  function loop(){
    update();
    render();
    if(running) animId = requestAnimationFrame(loop);
  }

  function showGameOver(){
    running = false;
    overlayTitle.textContent = 'you died';
    overlaySub.innerHTML = 'the arena resets. the bullet doesn\'t care whose turn it is.';
    overlayStat.style.display = 'block';
    overlayStat.innerHTML = `<b>${score}</b> kills &nbsp;·&nbsp; wave <b>${wave}</b>`;
    startBtn.textContent = 'try again';
    overlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', () => {
    overlay.classList.add('hidden');
    resetGame();
    waveNumEl.textContent = wave;
    scoreNumEl.textContent = score;
    running = true;
    if(animId) cancelAnimationFrame(animId);
    loop();
  });

  // initial render behind overlay
  resetGame();
  render();
})();
</script>
</body>
</html>
